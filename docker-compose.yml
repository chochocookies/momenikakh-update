services:
  mysql:
    image: mysql:8.4
    container_name: momenikah_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-momenikah}
      MYSQL_USER: ${DB_USERNAME:-momenikah}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - momenikah
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: momenikah_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - momenikah
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mysql_data:
    driver: local
    name: momenikah_mysql_data
  redis_data:
    driver: local
    name: momenikah_redis_data

networks:
  momenikah:
    driver: bridge
    name: momenikah_network
