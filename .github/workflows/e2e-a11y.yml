name: e2e-a11y
on: [pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local            # /styleguide only exists in local/staging
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      E2E_BASE_URL: http://momenikah.test:8000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: echo '127.0.0.1 momenikah.test app.momenikah.test undangan.momenikah.test' | sudo tee -a /etc/hosts
      - run: php artisan serve --host=0.0.0.0 --port=8000 &
      - run: npx wait-on http://momenikah.test:8000/up
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
