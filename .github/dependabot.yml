# FND-11: automatic update PRs. Each PR runs the normal CI (lint, static analysis, tests, build, audit, licences).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      laravel:
        patterns: ['laravel/*', 'livewire/*']
      dev-tools:
        dependency-type: development
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      vite-tailwind:
        patterns: ['vite', 'laravel-vite-plugin', 'tailwindcss', '@tailwindcss/*']
      playwright:
        patterns: ['@playwright/*', '@axe-core/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
